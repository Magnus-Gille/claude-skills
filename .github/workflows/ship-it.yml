name: ship-it

on:
  pull_request:
    paths:
      - "ship-it/**"
      - ".github/workflows/ship-it.yml"
  push:
    branches:
      - main
    paths:
      - "ship-it/**"
      - ".github/workflows/ship-it.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ship-it (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run ship-it tests
        run: python3 ship-it/scripts/test_check_ci.py

      - name: Compile Python sources
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for source in Path("ship-it").rglob("*.py"):
              compile(source.read_text(encoding="utf-8"), str(source), "exec")
          PY

      - name: Check diff
        run: git diff --check HEAD^1 HEAD
